# Pull-request checks only. Deployment to GitHub Pages is the separate deploy.yml, which runs on pushes to main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Pay-period counting, including leap years and short months.
      - name: Tests
        run: npm test

      # Type-checks, then builds exactly what deploy.yml would publish.
      - name: Build
        run: npm run build
